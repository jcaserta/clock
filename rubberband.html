<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rubber Band Ball Generator</title>
  <style>
    :root { --bg: #f3f3f3; --paper: #ffffff; --shadow: rgba(0,0,0,.18); }
    html, body { height: 100%; margin: 0; background: var(--bg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      background: var(--paper);
      border-radius: 18px;
      box-shadow: 0 18px 60px var(--shadow);
      padding: 18px;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top: 12px;
    }
    button{
      appearance:none;
      border:0;
      border-radius: 12px;
      padding: 10px 12px;
      background: #111;
      color:#fff;
      font-weight:600;
      cursor:pointer;
    }
    button:active{ transform: translateY(1px); }
    .hint{ color:#333; font-size: 13px; opacity:.8; user-select:none; }
    svg{ display:block; width:min(76vmin, 620px); height:auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="mount"></div>
      <div class="row">
        <button id="regen" type="button">Regenerate</button>
        <div class="hint">Refresh the page for a new ball. (Deterministic with seed in URL: <code>?seed=123</code>)</div>
      </div>
    </div>
  </div>

  <script>
    // ---------- Utilities ----------
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function() {
        a += 0x6D2B79F5;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hashStringToSeed(str) {
      // Simple 32-bit FNV-1a-ish
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp  = (a, b, t) => a + (b - a) * t;

    function hsl(h, s, l, a=1){
      return `hsla(${h.toFixed(1)} ${s.toFixed(1)}% ${l.toFixed(1)}% / ${a})`;
    }

    function getSeed() {
      const params = new URLSearchParams(location.search);
      if (params.has("seed")) {
        const raw = params.get("seed");
        const n = Number(raw);
        if (Number.isFinite(n)) return (n >>> 0);
        return hashStringToSeed(String(raw));
      }
      // Default: time-based seed
      return (Date.now() ^ (Math.random() * 0xFFFFFFFF)) >>> 0;
    }

    // ---------- Rubber band ball generator ----------
    function generateRubberBandBallSVG(seed) {
      const rand = mulberry32(seed);

      // Canvas
      const W = 900, H = 900;
      const cx = W * 0.5, cy = H * 0.52;

      // Ball geometry
      const R = lerp(290, 345, rand());          // radius
      const squash = lerp(0.90, 0.98, rand());   // slight perspective squash
      const Ry = R * squash;

      // Palette: natural rubber band tones (warm grays/tans)
      const baseHue = lerp(28, 44, rand()); // warm tan
      const baseSat = lerp(10, 22, rand());
      const baseLit = lerp(70, 80, rand());

      // Band styling ranges
      const bandCount = Math.floor(lerp(240, 420, rand()));
      const minW = lerp(3.0, 5.0, rand());
      const maxW = lerp(8.0, 13.0, rand());
      const roughness = lerp(0.6, 1.25, rand()); // more = more jitter
      const twistChance = lerp(0.10, 0.22, rand()); // occasional "fold" highlight

      // Lighting
      const lightAngle = lerp(-Math.PI * 0.95, -Math.PI * 0.55, rand()); // from upper-left
      const lx = Math.cos(lightAngle), ly = Math.sin(lightAngle);

      // SVG helpers
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "Randomly generated rubber band ball");

      const defs = document.createElementNS(ns, "defs");
      svg.appendChild(defs);

      // Background subtle vignette
      const bgGrad = document.createElementNS(ns, "radialGradient");
      bgGrad.setAttribute("id", "bgGrad");
      bgGrad.setAttribute("cx", "50%");
      bgGrad.setAttribute("cy", "45%");
      bgGrad.setAttribute("r", "75%");
      bgGrad.innerHTML = `
        <stop offset="0%"  stop-color="rgba(255,255,255,1)"/>
        <stop offset="60%" stop-color="rgba(247,247,247,1)"/>
        <stop offset="100%" stop-color="rgba(235,235,235,1)"/>
      `;
      defs.appendChild(bgGrad);

      // Sphere shading
      const sphereGrad = document.createElementNS(ns, "radialGradient");
      sphereGrad.setAttribute("id", "sphereGrad");
      sphereGrad.setAttribute("cx", `${(50 + lx*18).toFixed(1)}%`);
      sphereGrad.setAttribute("cy", `${(50 + ly*18).toFixed(1)}%`);
      sphereGrad.setAttribute("r", "70%");
      sphereGrad.innerHTML = `
        <stop offset="0%"  stop-color="rgba(255,255,255,0.60)"/>
        <stop offset="25%" stop-color="rgba(255,255,255,0.25)"/>
        <stop offset="58%" stop-color="rgba(0,0,0,0.05)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.22)"/>
      `;
      defs.appendChild(sphereGrad);

      // Soft shadow under the ball
      const shadow = document.createElementNS(ns, "ellipse");
      shadow.setAttribute("cx", cx);
      shadow.setAttribute("cy", cy + Ry * 0.92);
      shadow.setAttribute("rx", R * 0.78);
      shadow.setAttribute("ry", Ry * 0.20);
      shadow.setAttribute("fill", "rgba(0,0,0,0.20)");
      shadow.setAttribute("filter", "blur(10px)");
      svg.appendChild(shadow);

      // Backplate
      const bg = document.createElementNS(ns, "rect");
      bg.setAttribute("x", 0);
      bg.setAttribute("y", 0);
      bg.setAttribute("width", W);
      bg.setAttribute("height", H);
      bg.setAttribute("fill", "url(#bgGrad)");
      svg.appendChild(bg);

      // Clipping path for the ball
      const clip = document.createElementNS(ns, "clipPath");
      clip.setAttribute("id", "ballClip");
      const clipEllipse = document.createElementNS(ns, "ellipse");
      clipEllipse.setAttribute("cx", cx);
      clipEllipse.setAttribute("cy", cy);
      clipEllipse.setAttribute("rx", R);
      clipEllipse.setAttribute("ry", Ry);
      clip.appendChild(clipEllipse);
      defs.appendChild(clip);

      // The ball group (clipped)
      const gBall = document.createElementNS(ns, "g");
      gBall.setAttribute("clip-path", "url(#ballClip)");
      svg.appendChild(gBall);

      // Underlayer: subtle base fill so gaps never show as empty white
      const base = document.createElementNS(ns, "ellipse");
      base.setAttribute("cx", cx);
      base.setAttribute("cy", cy);
      base.setAttribute("rx", R);
      base.setAttribute("ry", Ry);
      base.setAttribute("fill", hsl(baseHue, baseSat, baseLit, 1));
      gBall.appendChild(base);

      // Add “band” strokes
      // We draw lots of wobbly arcs whose width and tone vary slightly.
      function arcPath(theta0, theta1, phi, wobbleAmp, wobbleFreq) {
        // Parametric band line around the sphere:
        // x = cx + R * cos(t) * cos(phi)
        // y = cy + Ry * sin(t) * 1  (then small wobble)
        // This creates latitude-ish rings; we randomize phi and rotate by random theta range.
        const steps = 26 + Math.floor(rand() * 10);
        const pts = [];
        for (let i=0; i<=steps; i++){
          const u = i / steps;
          const t = lerp(theta0, theta1, u);
          const x = cx + (R * Math.cos(t) * Math.cos(phi));
          const y = cy + (Ry * Math.sin(t) * 1.0);

          // Wobble perpendicular-ish (screen-space) to feel like real rubber
          const wob = (Math.sin(t * wobbleFreq + phi*2.3) + (rand()-0.5)) * wobbleAmp * roughness;
          pts.push([x + wob * 0.55, y - wob * 0.45]);
        }
        // Smooth-ish cubic path
        let d = `M ${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
        for (let i=1; i<pts.length; i++){
          const p0 = pts[i-1], p1 = pts[i];
          const mx = (p0[0] + p1[0]) / 2;
          const my = (p0[1] + p1[1]) / 2;
          d += ` Q ${p0[0].toFixed(2)} ${p0[1].toFixed(2)} ${mx.toFixed(2)} ${my.toFixed(2)}`;
        }
        return d;
      }

      // Depth cue: darker toward bottom/right; brighter toward top/left
      function bandColor(sampleAngle, alpha=1){
        // sampleAngle is roughly the band’s dominant direction; use light vector for mild shading
        const facing = (Math.cos(sampleAngle) * lx + Math.sin(sampleAngle) * ly);
        const l = clamp(baseLit + facing*8 + (rand()-0.5)*6, 55, 86);
        const s = clamp(baseSat + (rand()-0.5)*6, 6, 28);
        const h = clamp(baseHue + (rand()-0.5)*8, 22, 55);
        return hsl(h, s, l, alpha);
      }

      // Order matters: draw deeper/darker first
      for (let i = 0; i < bandCount; i++){
        // Band “type”: mostly wraps around, some are shorter chords
        const fullWrap = rand() < 0.70;
        const span = fullWrap ? lerp(Math.PI*1.4, Math.PI*2.3, rand()) : lerp(Math.PI*0.35, Math.PI*1.1, rand());

        const theta0 = lerp(-Math.PI, Math.PI, rand());
        const theta1 = theta0 + (rand() < 0.5 ? span : -span);

        // phi changes how “vertical” it feels (0 = equator-ish). Push more variation.
        const phi = lerp(-1.15, 1.15, Math.pow(rand(), 0.75));

        // Wobble and width
        const w = lerp(minW, maxW, Math.pow(rand(), 0.8));
        const wobbleAmp = lerp(0.6, 2.3, rand());
        const wobbleFreq = lerp(1.6, 4.8, rand());

        // Slight depth/darkness bias based on band midpoint position on sphere
        const mid = (theta0 + theta1) * 0.5;
        const yMid = Math.sin(mid);
        const depthShade = clamp(0.12 + (yMid * 0.10) + (rand()-0.5)*0.06, 0.05, 0.22);

        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", arcPath(theta0, theta1, phi, wobbleAmp, wobbleFreq));
        path.setAttribute("fill", "none");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        path.setAttribute("stroke-width", w.toFixed(2));
        path.setAttribute("stroke", bandColor(mid, 1));
        path.setAttribute("opacity", (1 - depthShade).toFixed(3));

        // Add a subtle darker “underside” stroke to mimic rubber edge shadow
        const under = document.createElementNS(ns, "path");
        under.setAttribute("d", path.getAttribute("d"));
        under.setAttribute("fill", "none");
        under.setAttribute("stroke-linecap", "round");
        under.setAttribute("stroke-linejoin", "round");
        under.setAttribute("stroke-width", (w * 1.05).toFixed(2));
        under.setAttribute("stroke", "rgba(0,0,0,0.10)");
        under.setAttribute("opacity", clamp(depthShade + 0.05, 0.08, 0.22).toFixed(3));

        // Occasionally add a “twist highlight” stroke
        let hi = null;
        if (rand() < twistChance) {
          hi = document.createElementNS(ns, "path");
          hi.setAttribute("d", path.getAttribute("d"));
          hi.setAttribute("fill", "none");
          hi.setAttribute("stroke-linecap", "round");
          hi.setAttribute("stroke-linejoin", "round");
          hi.setAttribute("stroke-width", (w * 0.45).toFixed(2));
          hi.setAttribute("stroke", "rgba(255,255,255,0.40)");
          hi.setAttribute("opacity", lerp(0.10, 0.35, rand()).toFixed(3));
        }

        // Draw: underside then main, then highlight
        gBall.appendChild(under);
        gBall.appendChild(path);
        if (hi) gBall.appendChild(hi);
      }

      // Surface shading overlay (adds form, keeps bands visible)
      const shade = document.createElementNS(ns, "ellipse");
      shade.setAttribute("cx", cx);
      shade.setAttribute("cy", cy);
      shade.setAttribute("rx", R);
      shade.setAttribute("ry", Ry);
      shade.setAttribute("fill", "url(#sphereGrad)");
      shade.setAttribute("opacity", "0.95");
      gBall.appendChild(shade);

      // Rim occlusion (slightly darkens the edge for depth)
      const rim = document.createElementNS(ns, "ellipse");
      rim.setAttribute("cx", cx);
      rim.setAttribute("cy", cy);
      rim.setAttribute("rx", R * 1.002);
      rim.setAttribute("ry", Ry * 1.002);
      rim.setAttribute("fill", "none");
      rim.setAttribute("stroke", "rgba(0,0,0,0.14)");
      rim.setAttribute("stroke-width", (R * 0.02).toFixed(2));
      rim.setAttribute("opacity", "0.55");
      svg.appendChild(rim);

      return svg;
    }

    // ---------- Mount / Regenerate ----------
    const mount = document.getElementById("mount");
    const regenBtn = document.getElementById("regen");

    function render(seed) {
      mount.innerHTML = "";
      mount.appendChild(generateRubberBandBallSVG(seed));
    }

    let seed = getSeed();
    render(seed);

    regenBtn.addEventListener("click", () => {
      // new seed each click (also updates URL for repeatability)
      seed = (Date.now() ^ ((Math.random() * 0xFFFFFFFF) >>> 0)) >>> 0;
      const url = new URL(location.href);
      url.searchParams.set("seed", String(seed >>> 0));
      history.replaceState({}, "", url);
      render(seed);
    });
  </script>
</body>
</html>
