<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Detection with Hover Paragraph</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    overflow-x: hidden;
  }

  /* Floating label for web view */
  #label-container {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 1000;
    max-width: 300px;

  }

  .title {
    font-size: 1em;
    font-weight: normal;
    color: white;
    background: rgba(0, 0, 0, 0.7);
    padding: 6px 10px;
    margin: 0;
    border-radius: 4px;
    cursor: pointer;
}

  .paragraph {
    font-size: 1em;
    line-height: 1.4;
    color: white;
    background: rgba(0, 0, 0, 0.7);
    padding: 6px 10px;
    margin: 0;
    border-radius: 4px;
    display: none;
  }

  /* Show paragraph on hover over the title */
  #label-container:hover .paragraph {
    display: block;
    margin-top: 4px;
  }

  /* Print button */
  #printBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    font-size: 1em;
    border-radius: 4px;
    cursor: pointer;
    z-index: 1000;
  }

  /* Section blocks */
  .section {
    width: 100vw;
    height: 100vh;
  }
  .section:nth-child(odd) {
    background-color: #ddd;
  }
  .section:nth-child(even) {
    background-color: #bbb;
  }

  /* Hidden print overlay */
  .print-overlay {
    display: none;
  }

  /* PRINT STYLES */
  @media print {
    body {
      margin: 0;
    }
    #label-container, #printBtn {
      display: none;
    }
    .section {
      page-break-before: always;
      page-break-after: always;
      width: 11in;
      height: 8.5in;
      box-sizing: border-box;
      position: relative;
    }
    .print-overlay {
      display: block;
      position: absolute;
      top: 10px;
      left: 10px;
      max-width: 300px;
    }
    .print-overlay .title {
      font-size: 1.5em;
      font-weight: bold;
      color: black;
      background: rgba(0, 0, 0, 0.1);
      margin: 0;
      padding: 6px 10px;
      border-radius: 4px 4px 0 0;
    }
    .print-overlay .paragraph {
      font-size: 1em;
      line-height: 1.4;
      color: black;
      background: rgba(0, 0, 0, 0.05);
      margin: 0;
      padding: 6px 10px;
      border-radius: 0 0 4px 4px;
    }
    @page {
      size: letter landscape;
      margin: 0;
    }
  }
</style>
</head>
<body>

<div id="label-container">
  <div class="title" id="live-title">Title 1</div>
  <div class="paragraph" id="live-paragraph">Lorem ipsum dolor sit amet.</div>
</div>

<button id="printBtn" onclick="window.print()">Print</button>

<script>
  // Custom section data with HTML content
  const sectionData = [
    {
      title: 'Introduction',
      paragraph: 'Welcome! Visit <a href="https://example.com" target="_blank">Example</a> for more info.'
    },
    {
      title: 'Resources',
      paragraph: 'Check out <a href="https://github.com/" target="_blank">GitHub</a> for code hosting.'
    },
    {
      title: 'Contact',
      paragraph: 'Email us at <a href="mailto:support@example.com">support@example.com</a>.'
    },
    // Add more objects as needed
  ];

  // Create sections with hidden print overlays
  sectionData.forEach((data, i) => {
    const section = document.createElement('div');
    section.className = 'section';
    section.id = `section-${i+1}`;

    // Print overlay
    const overlay = document.createElement('div');
    overlay.className = 'print-overlay';
    const titleEl = document.createElement('div');
    titleEl.className = 'title';
    titleEl.innerHTML = data.title; // Use innerHTML for HTML content
    const paraEl = document.createElement('div');
    paraEl.className = 'paragraph';
    paraEl.innerHTML = data.paragraph; // Use innerHTML for HTML content

    overlay.appendChild(titleEl);
    overlay.appendChild(paraEl);
    section.appendChild(overlay);

    document.body.appendChild(section);
  });

  // Intersection observer for updating floating label
  const liveTitle = document.getElementById('live-title');
  const liveParagraph = document.getElementById('live-paragraph');
  const sections = document.querySelectorAll('.section');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio > 0.99) {
        const index = parseInt(entry.target.id.split('-')[1], 10) - 1;
        liveTitle.innerHTML = sectionData[index].title;
        liveParagraph.innerHTML = sectionData[index].paragraph;
      }
    });
  }, { threshold: buildThresholdList() });

  sections.forEach(section => observer.observe(section));

  function buildThresholdList() {
    let thresholds = [];
    for (let i = 0; i <= 1.0; i += 0.01) {
      thresholds.push(i);
    }
    return thresholds;
  }
</script>

</body>
</html>
