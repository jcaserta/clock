<script>
(() => {
  const G=15, BORDER=1, TOTAL=17;
  const CX=Math.floor(G/2), CY=Math.floor(G/2);
  const MAXR=Math.floor(G/2)-1;
  const ticksEl=document.getElementById('ticks');
  const handsEl=document.getElementById('hands');
  const secondsEl=document.getElementById('seconds');

  function makeCells(container){
    const cells=[];
    for(let y=0;y<TOTAL;y++) for(let x=0;x<TOTAL;x++){
      const cell=document.createElement('div');
      cell.className='px';
      container.appendChild(cell);
      cells.push(cell);
    }
    return cells;
  }

  const ticks=makeCells(ticksEl);
  const hands=makeCells(handsEl);
  const seconds=makeCells(secondsEl);
  const idx=(x,y)=>(y+BORDER)*TOTAL+(x+BORDER);

  function line(x0,y0,x1,y1){
    const cells=[];
    let dx=Math.abs(x1-x0), sx=x0<x1?1:-1;
    let dy=-Math.abs(y1-y0), sy=y0<y1?1:-1;
    let err=dx+dy;
    for(;;){
      cells.push([x0,y0]);
      if(x0===x1&&y0===y1) break;
      const e2=2*err;
      if(e2>=dy){err+=dy;x0+=sx;}
      if(e2<=dx){err+=dx;y0+=sy;}
    }
    return cells;
  }

  function polar(angle,r){
    return [CX+Math.round(Math.sin(angle)*r),CY-Math.round(Math.cos(angle)*r)];
  }

  for(let k=0;k<12;k++){
    const [x,y]=polar(Math.PI*2*k/12,MAXR);
    ticks[idx(x,y)].className='px tick';
  }

  const clear=cells=>{for(const cell of cells) cell.className='px';};

  function drawHands(){
    clear(hands);
    const now=new Date(), m=now.getMinutes(), h=now.getHours()%12;
    const minute=polar(Math.PI*2*m/60,MAXR);
    const hour=polar(Math.PI*2*(h+m/60)/12,Math.max(2,Math.round(MAXR*.5)));
    for(const [x,y] of line(CX,CY,...minute)) hands[idx(x,y)].className='px fill';
    for(const [x,y] of line(CX,CY,...hour)) hands[idx(x,y)].className='px fillHour';
  }

  function drawSeconds(){
    clear(seconds);
    const now=new Date();
    const s=now.getSeconds()+now.getMilliseconds()/1000;
    for(const [x,y] of line(CX,CY,...polar(Math.PI*2*s/60,MAXR))){
      seconds[idx(x,y)].className='px sec';
    }
  }

  function animate(){drawSeconds();requestAnimationFrame(animate);}
  function schedule(){
    const now=new Date();
    setTimeout(()=>{drawHands();schedule();},1000-now.getMilliseconds()+1);
  }

  drawHands();
  animate();
  schedule();
})();
</script>
