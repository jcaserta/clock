<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time Bars</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e6e6e6;
      font-family: Arial, Helvetica, sans-serif;
    }

    .bar-row {
      position: relative;
      width: 100vw;
      height: calc(100vh / 3);
      background: #e6e6e6;
    }

    .bar {
      height: 100%;
      width: 0%;
    }

    .red {
      background: red;
    }

    .green {
      background: green;
    }

    .blue {
      background: blue;
    }

    .label {
      position: absolute;
      right: 1.5vw;
      top: 50%;
      transform: translateY(-50%);
      color: black;
      font-size: clamp(2rem, 12vw, 14rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.06em;
      z-index: 2;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>
  <section class="bar-row">
    <div id="hoursBar" class="bar red"></div>
    <div id="hoursLabel" class="label">0</div>
  </section>

  <section class="bar-row">
    <div id="minutesBar" class="bar green"></div>
    <div id="minutesLabel" class="label">00</div>
  </section>

  <section class="bar-row">
    <div id="secondsBar" class="bar blue"></div>
    <div id="secondsLabel" class="label">00</div>
  </section>

  <script>
    const hoursBar = document.getElementById("hoursBar");
    const minutesBar = document.getElementById("minutesBar");
    const secondsBar = document.getElementById("secondsBar");

    const hoursLabel = document.getElementById("hoursLabel");
    const minutesLabel = document.getElementById("minutesLabel");
    const secondsLabel = document.getElementById("secondsLabel");

    function pad(n) {
      return n.toString().padStart(2, "0");
    }

    function updateBars() {
      const now = new Date();

      const h = now.getHours();   // 0–23
      const m = now.getMinutes(); // 0–59
      const s = now.getSeconds(); // 0–59

      const hoursPercent = (h / 24) * 100;
      const minutesPercent = (m / 60) * 100;
      const secondsPercent = (s / 60) * 100;

      hoursBar.style.width = `${hoursPercent}%`;
      minutesBar.style.width = `${minutesPercent}%`;
      secondsBar.style.width = `${secondsPercent}%`;

      hoursLabel.textContent = h;
      minutesLabel.textContent = pad(m);
      secondsLabel.textContent = pad(s);
    }

    updateBars();
    setInterval(updateBars, 1000);
  </script>
</body>
</html>
