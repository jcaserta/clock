<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RGB Pie Clock</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#ddd;
    }

    .clock-container {
      width: min(92vmin, 98vw);
      aspect-ratio: 1 / 1;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Wedges blend */
    .slice {
      mix-blend-mode: multiply;
    }

    /* Pure RGB wedges */
    #hoursSlice   { fill: #0000ff; }
    #minutesSlice { fill: #00ff00; }
    #secondsSlice { fill: #ff0000; }

    /* Numbers now ALSO blend */
    text {
      font-size: 15px;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      mix-blend-mode: multiply;   /* ✅ key change */
    }

    #hoursLabel   { fill: #0000ff; }
    #minutesLabel { fill: #00ff00; }
    #secondsLabel { fill: #ff0000; }

    #backgroundCircle {
      fill: #fff;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <svg viewBox="0 0 200 200">
      <g id="pie" transform="translate(100,100)">

        <!-- Background disk -->
        <circle id="backgroundCircle" r="80"></circle>

        <!-- Wedges -->
        <path id="hoursSlice" class="slice"></path>
        <path id="minutesSlice" class="slice"></path>
        <path id="secondsSlice" class="slice"></path>

        <!-- Outside numbers -->
        <text id="hoursLabel"></text>
        <text id="minutesLabel"></text>
        <text id="secondsLabel"></text>

      </g>
    </svg>
  </div>

  <script>
    const radius = 80;
    const labelDistance = 1.15;

    const hoursSlice   = document.getElementById("hoursSlice");
    const minutesSlice = document.getElementById("minutesSlice");
    const secondsSlice = document.getElementById("secondsSlice");

    const hoursLabel   = document.getElementById("hoursLabel");
    const minutesLabel = document.getElementById("minutesLabel");
    const secondsLabel = document.getElementById("secondsLabel");

    function sectorPath(startAngle, endAngle, r) {
      const sweep = endAngle - startAngle;
      if (Math.abs(sweep) < 0.0001) return "";

      const largeArc = sweep > Math.PI ? 1 : 0;

      const x1 = r * Math.cos(startAngle);
      const y1 = r * Math.sin(startAngle);
      const x2 = r * Math.cos(endAngle);
      const y2 = r * Math.sin(endAngle);

      return `
        M 0 0
        L ${x1} ${y1}
        A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}
        Z
      `;
    }

    function placeLabel(label, endAngle, r) {
      const labelRadius = r * labelDistance;
      const x = labelRadius * Math.cos(endAngle);
      const y = labelRadius * Math.sin(endAngle);
      label.setAttribute("x", x);
      label.setAttribute("y", y);
    }

    function updateClock() {
      const now = new Date();
      const h24 = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();

      const rawHour12 = h24 % 12;
      const hourBase = rawHour12 === 0 ? 12 : rawHour12;

      const hoursFraction =
        (rawHour12 + m / 60 + s / 3600) / 12;
      const minutesFraction = (m + s / 60) / 60;
      const secondsFraction = s / 60;

      const baseAngle = -Math.PI / 2;

      const hEnd = baseAngle + hoursFraction   * Math.PI * 2;
      const mEnd = baseAngle + minutesFraction * Math.PI * 2;
      const sEnd = baseAngle + secondsFraction * Math.PI * 2;

      hoursSlice.setAttribute("d", sectorPath(baseAngle, hEnd, radius));
      minutesSlice.setAttribute("d", sectorPath(baseAngle, mEnd, radius));
      secondsSlice.setAttribute("d", sectorPath(baseAngle, sEnd, radius));

      placeLabel(hoursLabel,   hEnd, radius);
      placeLabel(minutesLabel, mEnd, radius);
      placeLabel(secondsLabel, sEnd, radius);

      hoursLabel.textContent   = hourBase;
      minutesLabel.textContent = String(m).padStart(2, "0");
      secondsLabel.textContent = String(s).padStart(2, "0");

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
