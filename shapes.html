<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shapes Each Minute</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: white;
      height: 100%;
      overflow-y: auto;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1rem;
    }

    .shape-container {
      display: flex;
      flex-wrap: wrap;
      width: 100%;
      gap: 0.75rem;
    }

    .shape {
      width: 33.333vw; /* 1/3 of screen width */
      max-width: 450px;
      min-width: 200px;
      min-height: 80px;
      animation: popIn 0.5s ease-out;
      transform-origin: center center;
      box-shadow: 0 0.4rem 1rem rgba(0,0,0,0.15);
    }

    /* Shape Variants */
    .shape--rectangle { }
    .shape--circle { border-radius: 999px; }
    .shape--pill {
      border-radius: 999px;
      height: 12vh !important;
    }
    .shape--diamond {
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }
    .shape--triangle {
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }
    .shape--polygon-1 {
      clip-path: polygon(10% 10%, 90% 0%, 100% 60%, 70% 100%, 0% 80%);
    }
    .shape--polygon-2 {
      clip-path: polygon(0% 20%, 40% 0%, 100% 20%, 90% 90%, 30% 100%);
    }
    .shape--polygon-3 {
      clip-path: polygon(15% 0%, 100% 20%, 80% 80%, 30% 100%, 0% 50%);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 700px) {
      .shape { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shape-container" id="shapeContainer"></div>

  <script>
    const container = document.getElementById('shapeContainer');

    const SHAPE_TYPES = [
      'rectangle','circle','pill','diamond',
      'triangle','polygon-1','polygon-2','polygon-3'
    ];

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      const sat = randomBetween(50, 85);
      const light = randomBetween(40, 70);
      return `hsl(${hue}, ${sat}%, ${light}%)`;
    }

    function createShape() {
      const shape = document.createElement('div');
      const type = SHAPE_TYPES[Math.floor(Math.random() * SHAPE_TYPES.length)];
      shape.classList.add('shape', `shape--${type}`);

      shape.style.height = randomBetween(12, 40) + 'vh';
      shape.style.background = randomColor();

      const rotation = randomBetween(-18, 18);
      shape.style.transform = `rotate(${rotation}deg)`;

      if (type === 'rectangle') {
        const r1 = Math.floor(randomBetween(0, 60));
        const r2 = Math.floor(randomBetween(0, 60));
        const r3 = Math.floor(randomBetween(0, 60));
        const r4 = Math.floor(randomBetween(0, 60));
        shape.style.borderRadius = `${r1}px ${r2}px ${r3}px ${r4}px`;
      }

      return shape;
    }

    function addShape() {
      const newShape = createShape();
      if (container.firstChild) {
        container.insertBefore(newShape, container.firstChild);
      } else {
        container.appendChild(newShape);
      }
    }

    // Initial shape
    addShape();

    // One shape per minute
    setInterval(addShape, 60000);

    // Uncomment for quick testing
    // setInterval(addShape, 3000);
  </script>
</body>
</html>
