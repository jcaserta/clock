<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Circle Time Field</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #111;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: stretch;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff;
  }

  .field {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* White horizontal bar crossing the screen */
  .bar {
    position: absolute;
    left: 0;
    right: 0;
    top: 45%;
    height: 12%;
    background: #fdfdfd;
    z-index: 0;
  }

  .grid {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    grid-auto-rows: minmax(70px, 1fr);
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .circle {
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    transform-origin: center center;
    transition: transform 0.15s linear;
  }

  /* Base sizes; scaling is done via transform */
  .circle.h {
    width: 70%;
    background: #fff;
  }

  .circle.m {
    width: 60%;
    background: #000;
    border: 2px solid #fff;
  }

  .circle.s {
    width: 40%;
    background: #fff;
  }
</style>
</head>
<body>
<div class="field">
  <div class="bar"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
  const grid = document.getElementById('grid');
  const NUM_CELLS = 120; // how many circles to generate

  const units = ['h', 'm', 's'];

  // Create the circle field
  for (let i = 0; i < NUM_CELLS; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';

    const circle = document.createElement('div');
    const unit = units[Math.floor(Math.random() * units.length)];
    const offset = Math.random(); // phase offset

    circle.className = `circle ${unit}`;
    circle.dataset.unit = unit;
    circle.dataset.offset = offset.toString();

    cell.appendChild(circle);
    grid.appendChild(cell);
  }

  const circles = Array.from(document.querySelectorAll('.circle'));

  function update() {
    const now = new Date();

    const h12 = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds() + now.getMilliseconds() / 1000;

    // Normalized values 0–1
    const hNorm = (h12 + m / 60) / 12;
    const mNorm = (m + s / 60) / 60;
    const sNorm = s / 60;

    circles.forEach(circle => {
      const unit = circle.dataset.unit;
      const offset = parseFloat(circle.dataset.offset) || 0;

      let baseNorm;
      if (unit === 'h') {
        baseNorm = hNorm;
      } else if (unit === 'm') {
        baseNorm = mNorm;
      } else {
        baseNorm = sNorm;
      }

      // phase-shifted sine wave for smooth in/out
      const phase = 2 * Math.PI * (baseNorm + offset);
      // sine in [0,1]
      const wave = (Math.sin(phase) + 1) / 2;

      // hours change slowest, seconds fastest; keep all gentle
      const minScale = 0.75;
      const maxScale = unit === 's' ? 1.25 : unit === 'm' ? 1.3 : 1.35;
      const scale = minScale + wave * (maxScale - minScale);

      circle.style.transform = `scale(${scale})`;
    });

    requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
</script>
</body>
</html>
